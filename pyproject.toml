[project]
name = "ppe-labeling"
version = "0.1.0"
description = "PPE image annotation tool with FastAPI backend and React frontend."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic-settings==2.14.1",
    "python-multipart==0.0.32",
    "ultralytics==8.4.61",
    "opencv-python==4.13.0.92",
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
