[project]
name = "ppe-labeling"
version = "0.1.0"
description = "PPE, safety-sign, and pose-video annotation tool with FastAPI and React."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]==0.49.0",
    "pydantic-settings==2.14.1",
    "python-multipart==0.0.32",
    "ultralytics==8.4.61",
    "opencv-python==4.13.0.92",
    "numpy==2.2.6",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "pyarrow==21.0.0",
    "joblib==1.5.2",
    "onnxruntime==1.23.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.3",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu132", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
