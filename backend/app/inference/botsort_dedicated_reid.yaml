# Heavier BoT-SORT profile for fall-and-rotation ID continuity.
#
# The classifier encoder runs independently on each detected person crop. This
# is slower than `model: auto`, but supplies more stable appearance embeddings
# when a person's pose changes sharply during a fall.
tracker_type: botsort
track_high_thresh: 0.20
track_low_thresh: 0.05
new_track_thresh: 0.20
track_buffer: 72
match_thresh: 0.90
fuse_score: true
gmc_method: sparseOptFlow
proximity_thresh: 0.15
appearance_thresh: 0.65
with_reid: true
model: weights/reid.pt
